<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
                xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
                layout:decorate="~{layouts/basicLayout}">

<th:block layout:fragment="script">
    <script th:inline="javascript">


    </script>
</th:block>


<div layout:fragment="content">
    <h2 class="text-center">회 원 정 보 수 정</h2>
    <form role="form" method="post" th:object="${memberDto}">
        <div class="input-group mb-3">
            <label th:for="name" class="input-group-text">이름</label>
            <input type="text" th:field="*{name}" th:value="${member.name}" class="form-control" placeholder="이름을 입력해주세요" />
        </div>
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="fieldError mb-3" style="color:red; font-size:13px; text-align:left">Incorrect data</div>
        <div class="input-group mb-3">
            <label th:for="email" class="input-group-text">이메일주소</label>
            <input type="email" th:value="${member.email}" readonly class="form-control" >
        </div>
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="fieldError mb-3" style="color:red; font-size:13px; text-align:left">Incorrect data</div>
        <div class="input-group mb-3">
            <label th:for="address" class="input-group-text">주소</label>
            <input type="text" th:field="*{address}" th:value="${member.address}" class="form-control mb-3" placeholder="주소를 입력해주세요">
        </div>
        <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="fieldError" style="color:red; font-size:13px; text-align:left">Incorrect data</div>
        <div class="mb-3" style="text-align: center">
            <button type="button" class="btn btn-success" onclick="fCheck()">회원정보수정</button> &nbsp;
            <button type="reset" class="btn btn-warning">다시작성</button> &nbsp;
            <button type="button" class="btn btn-info" onclick="location.href='memberMain';">돌아가기</button>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>
</div>

</html>
